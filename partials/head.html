<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{titulo}}</title>
<meta name="description" content="{{descripcion}}" />
<meta name="robots" content="{{robots}}" />
<meta name="theme-color" content="#0A0E14" />
<link rel="canonical" href="{{canonical}}" />
{{hreflang_block}}

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Centinela" />
<meta property="og:title" content="{{titulo}}" />
<meta property="og:description" content="{{og_descripcion}}" />
<meta property="og:url" content="{{canonical}}" />
<meta property="og:locale" content="{{og_locale}}" />
{{og_alt_block}}
<meta name="twitter:card" content="summary_large_image" />

<!-- Favicon (SVG inline: escudo/centinela) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E14'/%3E%3Cpath d='M16 5l8 3v7c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V8l8-3z' fill='none' stroke='%233FB8AE' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 12v8M12 16h8' stroke='%233FB8AE' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/assets/css/styles.css" />
<!-- Sin JS no hay reveal-on-scroll: el contenido tiene que verse igual. -->
<noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>
<script src="/assets/js/main.js" defer></script>
