<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada · Centinela</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0A0E14" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E14'/%3E%3Cpath d='M16 5l8 3v7c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V8l8-3z' fill='none' stroke='%233FB8AE' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 12v8M12 16h8' stroke='%233FB8AE' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="bg-field" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Página única para todo el sitio: GitHub Pages solo admite un 404.
       Por eso va en cuatro idiomas, en corto. -->
  <main class="page-hero page-hero--center">
    <div class="wrap">
      <span class="tag">Error 404</span>
      <h1 class="page-hero__title">Esta página <em>no existe.</em></h1>
      <p class="page-hero__lead">
        El enlace que has seguido está roto o la página ha cambiado de sitio.
      </p>
      <p class="page-hero__lead" lang="en">This page doesn’t exist. · <span lang="it">Questa pagina non esiste.</span> · <span lang="de">Diese Seite gibt es nicht.</span></p>
      <div class="page-hero__cta">
        <a class="btn btn--solid btn--lg" href="/">Inicio</a>
        <a class="btn btn--line" href="/en/" hreflang="en" lang="en">English</a>
        <a class="btn btn--line" href="/it/" hreflang="it" lang="it">Italiano</a>
        <a class="btn btn--line" href="/de/" hreflang="de" lang="de">Deutsch</a>
      </div>
    </div>
  </main>
</body>
</html>
